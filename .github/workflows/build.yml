# Build the host binary for Windows / macOS / Linux.
# Run on: tag push (v*), manual dispatch.
name: Build host binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dsh-desktop-windows-x64
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-14
            artifact: dsh-desktop-darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-14
            artifact: dsh-desktop-darwin-x64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            artifact: dsh-desktop-linux-x64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: Build (release)
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --target "${{ matrix.target }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/dsh-desktop${{ matrix.ext }}
          if-no-files-found: error

  # Tag push (v*) → assemble the four platform binaries into one GitHub Release.
  # Asset names are the contract for dsh-desktop-tools' auto-install downloader.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          set -e
          mkdir -p assets
          cp "artifacts/dsh-desktop-windows-x64/dsh-desktop.exe" "assets/dsh-desktop-windows-x64.exe"
          cp "artifacts/dsh-desktop-darwin-arm64/dsh-desktop"    "assets/dsh-desktop-darwin-arm64"
          cp "artifacts/dsh-desktop-darwin-x64/dsh-desktop"      "assets/dsh-desktop-darwin-x64"
          cp "artifacts/dsh-desktop-linux-x64/dsh-desktop"       "assets/dsh-desktop-linux-x64"
          ls -la assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

